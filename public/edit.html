<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit — Museum of Us</title>
<style>
  body{margin:0;background:#faf9f5;color:#2b2118;font-family:'Work Sans',system-ui,sans-serif;padding:24px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:0 0 4px;}
  .sub{color:#7a6a52;font-size:13px;margin:0 0 24px;}
  .frame{border:1px solid #ded4bd;border-radius:10px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;}
  .frame img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#ede2c8;flex-shrink:0;}
  .frame .noimg{width:64px;height:64px;border-radius:6px;background:#ede2c8;flex-shrink:0;}
  .fields{flex:1;display:flex;flex-direction:column;gap:6px;}
  input[type=text]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid #ded4bd;border-radius:6px;}
  .actions-row{display:flex;gap:10px;align-items:center;}
  button{font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:16px;
    border:1px solid #8a6a2f;background:transparent;color:#2b2118;cursor:pointer;}
  button.primary{background:#eecf8e;border-color:#eecf8e;}
  .top-actions{display:flex;gap:10px;margin-bottom:20px;}
  #linkOut{margin-top:16px;padding:12px;background:#ede2c8;border-radius:8px;font-size:13px;word-break:break-all;display:none;}
  #status{font-size:13px;color:#7a6a52;min-height:18px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="titleHeading">Loading…</h1>
    <p class="sub">This is the plumbing test page — real gallery visuals (frames on the museum wall, drag/zoom, music) come next. For now: confirm creating, editing, uploading a photo, resetting, and generating a gift link all actually work end to end.</p>
    <div class="top-actions">
      <button id="resetBtn" type="button">Reset everything</button>
      <button class="primary" id="shareBtn" type="button">Get gift link</button>
    </div>
    <div id="status"></div>
    <div id="linkOut"></div>
    <div id="frames"></div>
  </div>

<script>
  var params = new URLSearchParams(window.location.search);
  var museumId = params.get('id');
  var editToken = params.get('token');
  var statusEl = document.getElementById('status');
  var framesEl = document.getElementById('frames');
  var titleHeading = document.getElementById('titleHeading');
  var linkOut = document.getElementById('linkOut');

  if (!museumId || !editToken) {
    document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;">Missing museum id or edit link. Start from the homepage.</p>';
    throw new Error('missing params');
  }

  var PHOTO_MAX_DIM = 1400;
  var PHOTO_TARGET_BYTES = 170 * 1024;
  var PHOTO_QUALITY_STEPS = [0.82, 0.72, 0.62, 0.52, 0.42, 0.32];

  function compressImageFile(file, cb) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { cb(ev.target.result); return; }
        var scale = Math.min(1, PHOTO_MAX_DIM / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        if (!ctx) { cb(ev.target.result); return; }
        ctx.drawImage(img, 0, 0, cw, ch);
        var best = null;
        for (var i = 0; i < PHOTO_QUALITY_STEPS.length; i++) {
          var dataUrl;
          try { dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY_STEPS[i]); }
          catch (err) { cb(ev.target.result); return; }
          best = dataUrl;
          var b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
          if (b64.length * 0.75 <= PHOTO_TARGET_BYTES) break;
        }
        cb(best || ev.target.result);
      };
      img.onerror = function () { cb(ev.target.result); };
      img.src = ev.target.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

  function apiGet() {
    return fetch('/api/museums/' + museumId + '?token=' + encodeURIComponent(editToken))
      .then(function (r) { return r.json(); });
  }

  function renderFrames(museum) {
    titleHeading.textContent = museum.title || 'Museum of Us';
    framesEl.innerHTML = '';
    museum.artworks.forEach(function (a) {
      var row = document.createElement('div');
      row.className = 'frame';

      var img;
      if (a.imageUrl) {
        img = document.createElement('img');
        img.src = a.imageUrl;
      } else {
        img = document.createElement('div');
        img.className = 'noimg';
      }
      row.appendChild(img);

      var fields = document.createElement('div');
      fields.className = 'fields';

      var titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.placeholder = 'Title';
      titleInput.value = a.title || '';

      var noteInput = document.createElement('input');
      noteInput.type = 'text';
      noteInput.placeholder = 'Note';
      noteInput.value = a.note || '';

      var saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.textContent = 'Save';
      saveBtn.style.alignSelf = 'flex-start';
      saveBtn.addEventListener('click', function () {
        statusEl.textContent = 'Saving…';
        fetch('/api/museums/' + museumId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: editToken,
            artworks: [{ id: a.id, title: titleInput.value, note: noteInput.value }],
          }),
        })
          .then(function (r) { return r.json(); })
          .then(function () { statusEl.textContent = 'Saved.'; })
          .catch(function () { statusEl.textContent = 'Save failed.'; });
      });

      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        statusEl.textContent = 'Uploading photo…';
        compressImageFile(file, function (dataUrl) {
          if (!dataUrl) { statusEl.textContent = 'Could not read that photo.'; return; }
          fetch('/api/museums/' + museumId + '/photo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: editToken, artworkId: a.id, dataUrl: dataUrl }),
          })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (res.imageUrl) {
                statusEl.textContent = 'Photo uploaded.';
                loadAndRender();
              } else {
                statusEl.textContent = 'Upload failed: ' + (res.error || 'unknown');
              }
            })
            .catch(function () { statusEl.textContent = 'Upload failed.'; });
        });
      });

      var actionsRow = document.createElement('div');
      actionsRow.className = 'actions-row';
      actionsRow.appendChild(saveBtn);
      actionsRow.appendChild(fileInput);

      fields.appendChild(titleInput);
      fields.appendChild(noteInput);
      fields.appendChild(actionsRow);
      row.appendChild(fields);
      framesEl.appendChild(row);
    });
  }

  function loadAndRender() {
    apiGet().then(function (museum) {
      if (!museum || museum.error) {
        statusEl.textContent = 'Could not load this museum.';
        return;
      }
      renderFrames(museum);
    });
  }

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Reset everything to blank? This cannot be undone.')) return;
    statusEl.textContent = 'Resetting…';
    fetch('/api/museums/' + museumId + '?action=reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: editToken }),
    })
      .then(function (r) { return r.json(); })
      .then(function (museum) {
        statusEl.textContent = 'Reset.';
        renderFrames(museum);
      });
  });

  document.getElementById('shareBtn').addEventListener('click', function () {
    var url = new URL(window.location.origin + '/gift.html');
    url.searchParams.set('id', museumId);
    linkOut.style.display = 'block';
    linkOut.textContent = url.toString();
  });

  loadAndRender();
</script>
</body>
</html>
