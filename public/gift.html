<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A gift for you — Museum of Us</title>
<style>
  body{margin:0;background:#3a1712;color:#f6efdf;font-family:'Work Sans',system-ui,sans-serif;padding:24px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:28px;margin:0 0 20px;}
  .frame{border:1px solid #5a3a30;border-radius:10px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;}
  .frame img{width:72px;height:72px;object-fit:cover;border-radius:6px;background:#4a241d;flex-shrink:0;}
  .frame .noimg{width:72px;height:72px;border-radius:6px;background:#4a241d;flex-shrink:0;}
  .frame h3{margin:0 0 4px;font-size:15px;}
  .frame p{margin:0;font-size:13px;color:#cdbfa5;}
  #status{font-size:13px;color:#cdbfa5;}
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="titleHeading">Loading…</h1>
    <div id="status"></div>
    <div id="frames"></div>
  </div>
<script>
  var params = new URLSearchParams(window.location.search);
  var museumId = params.get('id');
  var statusEl = document.getElementById('status');
  var framesEl = document.getElementById('frames');
  var titleHeading = document.getElementById('titleHeading');

  if (!museumId) {
    document.body.innerHTML = '<p style="padding:40px;">No gift link supplied.</p>';
    throw new Error('missing id');
  }

  fetch('/api/museums/' + museumId)
    .then(function (r) { return r.json(); })
    .then(function (museum) {
      if (!museum || museum.error) {
        statusEl.textContent = "This gift link isn't valid.";
        return;
      }
      titleHeading.textContent = museum.title || 'Museum of Us';
      museum.artworks.forEach(function (a) {
        if (!a.imageUrl && !a.title && !a.note) return; // skip untouched blank frames
        var row = document.createElement('div');
        row.className = 'frame';
        var img;
        if (a.imageUrl) {
          img = document.createElement('img');
          img.src = a.imageUrl;
        } else {
          img = document.createElement('div');
          img.className = 'noimg';
        }
        row.appendChild(img);
        var text = document.createElement('div');
        var h3 = document.createElement('h3');
        h3.textContent = a.title || 'Untitled';
        var p = document.createElement('p');
        p.textContent = a.note || '';
        text.appendChild(h3);
        text.appendChild(p);
        row.appendChild(text);
        framesEl.appendChild(row);
      });
    })
    .catch(function () { statusEl.textContent = 'Could not load this gift.'; });
</script>
</body>
</html>
