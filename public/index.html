<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Museum of Us</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#3a1712;color:#f6efdf;font-family:'Work Sans',system-ui,sans-serif;text-align:center;}
  .card{max-width:420px;padding:40px;}
  p{color:#cdbfa5;line-height:1.5;margin:0;}
</style>
</head>
<body>
  <div class="card">
    <p id="status">Opening your museum&hellip;</p>
  </div>
  <script>
    var statusEl = document.getElementById('status');

    function goToMuseum(id, token){
      window.location.replace('/museum.html?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token));
    }

    // A returning visitor (this browser already made a museum before) goes
    // straight back to it instead of getting a brand new blank one.
    function readLastMuseum(){
      try {
        var last = JSON.parse(localStorage.getItem('lastMuseum') || 'null');
        if(last && last.id && last.token) return last;
      } catch(e) {}
      // Fall back to the older multi-museum map, for browsers that used the
      // previous "Start your museum" button before this page auto-redirected.
      try {
        var saved = JSON.parse(localStorage.getItem('museumEditTokens') || '{}');
        var ids = Object.keys(saved);
        if(ids.length){ return { id: ids[0], token: saved[ids[0]] }; }
      } catch(e) {}
      return null;
    }

    function rememberMuseum(id, token){
      try {
        localStorage.setItem('lastMuseum', JSON.stringify({ id: id, token: token }));
        var saved = JSON.parse(localStorage.getItem('museumEditTokens') || '{}');
        saved[id] = token;
        localStorage.setItem('museumEditTokens', JSON.stringify(saved));
      } catch(e) {}
    }

    var existing = readLastMuseum();
    if(existing){
      goToMuseum(existing.id, existing.token);
    } else {
      fetch('/api/museums', { method: 'POST' })
        .then(function (r) {
          if (!r.ok) throw new Error('create_failed');
          return r.json();
        })
        .then(function (data) {
          rememberMuseum(data.id, data.editToken);
          goToMuseum(data.id, data.editToken);
        })
        .catch(function () {
          statusEl.textContent = 'Something went wrong, please refresh to try again.';
        });
    }
  </script>
</body>
</html>
