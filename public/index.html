<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Museum of Us</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#3a1712;color:#f6efdf;font-family:'Work Sans',system-ui,sans-serif;text-align:center;}
  .card{max-width:420px;padding:40px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:32px;margin:0 0 12px;}
  p{color:#cdbfa5;line-height:1.5;margin:0 0 28px;}
  button{font-family:inherit;font-size:15px;font-weight:600;padding:14px 28px;border-radius:24px;
    border:1px solid #eecf8e;background:#eecf8e;color:#170c08;cursor:pointer;}
  button:hover{background:#fff;border-color:#fff;}
  button:disabled{opacity:.6;cursor:default;}
  #status{margin-top:16px;color:#cdbfa5;font-size:13px;min-height:18px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Museum of Us</h1>
    <p>An interactive little museum you curate with your own photos and memories, then gift to someone as a link.</p>
    <button id="startBtn" type="button">Start your museum</button>
    <div id="status"></div>
  </div>
  <script>
    var startBtn = document.getElementById('startBtn');
    var statusEl = document.getElementById('status');

    startBtn.addEventListener('click', function () {
      startBtn.disabled = true;
      statusEl.textContent = 'Setting up your museum…';
      fetch('/api/museums', { method: 'POST' })
        .then(function (r) {
          if (!r.ok) throw new Error('create_failed');
          return r.json();
        })
        .then(function (data) {
          try {
            var saved = JSON.parse(localStorage.getItem('museumEditTokens') || '{}');
            saved[data.id] = data.editToken;
            localStorage.setItem('museumEditTokens', JSON.stringify(saved));
          } catch (e) {}
          window.location.href = '/edit.html?id=' + encodeURIComponent(data.id) + '&token=' + encodeURIComponent(data.editToken);
        })
        .catch(function () {
          statusEl.textContent = "Something went wrong, please try again.";
          startBtn.disabled = false;
        });
    });
  </script>
</body>
</html>
